<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门店补货与库存协同 · 现状流程图（含判断分支）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#f4f4f0;
         display:flex; justify-content:center; padding:32px 12px; }
  .card { background:#fff; border:1px solid #e3e1d8; border-radius:14px;
          max-width:780px; width:100%; padding:30px 26px 24px; }
  h1 { font-size:18px; font-weight:500; color:#2c2c2a; text-align:center; }
  .sub { font-size:12.5px; color:#888780; text-align:center; margin:8px 0 18px; line-height:1.6; }
  svg { width:100%; height:auto; display:block; }
  .note { font-size:12px; color:#888780; line-height:1.7; border-top:1px dashed #d3d1c7;
          margin-top:16px; padding-top:12px; }
  .note b { color:#5f5e5a; font-weight:500; }
</style>
</head>
<body>
<div class="card">
  <h1>门店补货与库存协同 · 现状流程（改造前）</h1>
  <p class="sub">菱形为人工判断点，红框为该环节暴露的现状问题 · 内容与 f 编号均取自《业务需求发现报告》</p>

  <svg viewBox="0 0 680 1040" width="100%" role="img">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <text x="340" y="30" text-anchor="middle" font-size="14" font-weight="500" fill="#2c2c2a">现状补货流程：四个人工判断点，每个都埋着一次数据失真</text>

    <!-- N1 门店 -->
    <g>
      <rect x="190" y="76" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="300" y="97" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">门店 · 店长</text>
      <text x="300" y="118" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2c2c2a">每日盘点缺货（20 个重点 SKU）</text>
    </g>
    <line x1="300" y1="132" x2="300" y2="141" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- D1 判断 -->
    <polygon points="300,141 395,172 300,203 205,172" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="300" y="172" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">实际有货 / 可售？</text>
    <text x="418" y="163" text-anchor="middle" font-size="12" fill="#444441">否</text>
    <line x1="395" y1="172" x2="445" y2="172" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="445" y="144" width="195" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="542" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#791F1F">系统仍显示有货（f10）</text>
      <text x="542" y="186" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">账实差异约 8%，缺货标识滞后</text>
    </g>
    <text x="310" y="222" font-size="12" fill="#444441">是</text>
    <line x1="300" y1="203" x2="300" y2="236" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- N2 门店 -->
    <g>
      <rect x="190" y="236" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="300" y="257" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">门店 · 店长</text>
      <text x="300" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2c2c2a">凭经验估量，整箱 / MOQ 靠记忆（f20）</text>
    </g>
    <line x1="300" y1="292" x2="300" y2="322" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- N3 总部 -->
    <g>
      <rect x="190" y="322" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="300" y="343" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">总部 · 补货计划员</text>
      <text x="300" y="364" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2c2c2a">汇总门店报数，用 POS 销量补正</text>
    </g>
    <line x1="300" y1="378" x2="300" y2="389" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- D2 判断 -->
    <polygon points="300,389 395,420 300,451 205,420" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="300" y="420" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">销量样本可用？（f31）</text>
    <text x="418" y="411" text-anchor="middle" font-size="12" fill="#444441">否</text>
    <line x1="395" y1="420" x2="445" y2="420" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="445" y="392" width="195" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="542" y="413" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#791F1F">促销 / 零销量样本失真（f31）</text>
      <text x="542" y="434" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">人工凭经验修正数据</text>
    </g>
    <text x="310" y="474" font-size="12" fill="#444441">是</text>
    <line x1="300" y1="451" x2="300" y2="493" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- D3 判断 -->
    <polygon points="300,493 395,524 300,555 205,524" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="300" y="524" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">账实一致？（f12）</text>
    <text x="418" y="515" text-anchor="middle" font-size="12" fill="#444441">否</text>
    <line x1="395" y1="524" x2="445" y2="524" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="445" y="496" width="195" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="542" y="517" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#791F1F">账实不一致（f12）</text>
      <text x="542" y="538" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">转人工核对后再继续</text>
    </g>
    <text x="310" y="576" font-size="12" fill="#444441">是</text>
    <line x1="300" y1="555" x2="300" y2="590" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- N4 总部 -->
    <g>
      <rect x="190" y="590" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="300" y="611" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">总部 · 补货计划员</text>
      <text x="300" y="632" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2c2c2a">生成补货单（表格发群）</text>
    </g>
    <line x1="300" y1="646" x2="300" y2="668" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- N5 仓配 -->
    <g>
      <rect x="190" y="668" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text x="300" y="689" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">区域仓配</text>
      <text x="300" y="710" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2c2c2a">按制度核定整箱与线路（f50）</text>
    </g>
    <line x1="300" y1="724" x2="300" y2="735" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- D4 判断 -->
    <polygon points="300,735 395,766 300,797 205,766" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="300" y="766" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">数据可直接发运？（f30）</text>
    <text x="418" y="757" text-anchor="middle" font-size="12" fill="#444441">否</text>
    <line x1="395" y1="766" x2="445" y2="766" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g>
      <rect x="445" y="738" width="195" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="542" y="759" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#791F1F">新旧码 / 套装码并存（f30）</text>
      <text x="542" y="780" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#A32D2D">口径不一，退回门店补正</text>
    </g>
    <text x="310" y="816" font-size="12" fill="#444441">是</text>
    <line x1="300" y1="797" x2="300" y2="830" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- N6 仓配 -->
    <g>
      <rect x="190" y="830" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text x="300" y="851" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">区域仓配</text>
      <text x="300" y="872" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2c2c2a">排线发运（周一 / 三 / 五）· 门店签收</text>
    </g>

    <!-- 痛点条 -->
    <text x="40" y="922" font-size="13" font-weight="500" fill="#791F1F">改造前痛点（对应报告事实编号）</text>
    <g>
      <rect x="40" y="934" width="145" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="112" y="958" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">缺货标识滞后</text>
    </g>
    <g>
      <rect x="190" y="934" width="145" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="262" y="958" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">账实差异约 8%（f12）</text>
    </g>
    <g>
      <rect x="340" y="934" width="145" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="412" y="958" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">约束靠人工记忆（f20）</text>
    </g>
    <g>
      <rect x="490" y="934" width="150" height="48" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="565" y="958" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#791F1F">30% 延迟无归因（f51）</text>
    </g>

    <!-- 图例 -->
    <g>
      <rect x="40" y="1000" width="26" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="74" y="1008" dominant-baseline="central" font-size="11" fill="#5f5e5a">流程步骤（按角色着色）</text>
      <polygon points="210,1000 226,1008 210,1016 194,1008" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
      <text x="236" y="1008" dominant-baseline="central" font-size="11" fill="#5f5e5a">人工判断（是 / 否分支）</text>
      <rect x="368" y="1000" width="26" height="16" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text x="402" y="1008" dominant-baseline="central" font-size="11" fill="#5f5e5a">现状问题（f 编号可回溯报告原文）</text>
    </g>
  </svg>

  <p class="note"><b>阅读说明</b>：主流程自上而下贯穿三个角色（门店 → 总部 → 区域仓配）；四个菱形是流程中真实存在的人工判断，每个判断走「否」分支时都会落入一个红框——那正是访谈确认的现状问题。这张图是「现状流程图-规范版」的重制：原 PNG 有判断框但为位图不可编辑，原 HTML 无判断框，本版合并两者优点（矢量可编辑 + 判断分支），并让每个问题都能通过 f 编号回溯到《业务需求发现报告》原文。</p>
</div>
</body>
</html>
