<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词模板管理 · 门店补货与库存协同</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; height: 100vh; background: #f4f6f9; color: #2c2c2a;
  }
  /* ===== 左侧导航（与知识库页一致） ===== */
  .nav { width: 220px; background: #085041; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }
  .nav .brand { padding: 20px 18px; font-size: 15px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,.12); }
  .nav .brand small { display: block; font-size: 11px; font-weight: 400; color: #9fe1cb; margin-top: 4px; }
  .nav a { display: block; padding: 12px 18px; color: #cdeee2; font-size: 13px; text-decoration: none; border-left: 3px solid transparent; }
  .nav a:hover { background: rgba(255,255,255,.08); }
  .nav a.active { background: rgba(255,255,255,.12); border-left-color: #fac775; color: #fff; }
  .nav a.disabled { opacity: .45; pointer-events: none; }
  .nav .foot { margin-top: auto; padding: 16px 18px; font-size: 12px; color: #9fe1cb; }
  .nav .foot a { padding: 0; color: #fac775; display: inline; border: none; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .page-header { padding: 16px 28px; background: #fff; border-bottom: 1px solid #e5e5e5; }
  .page-header h1 { font-size: 16px; font-weight: 600; }
  .page-header p { font-size: 12px; color: #888780; margin-top: 4px; }
  .content { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; gap: 20px; align-items: flex-start; }

  /* ===== 编辑卡片 ===== */
  .editor-card {
    flex: 1.2; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px;
    padding: 20px 24px; min-width: 0;
  }
  .editor-card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .editor-card input {
    width: 100%; padding: 9px 12px; font-size: 13px; border: 1px solid #d3d1c7;
    border-radius: 8px; outline: none; margin-bottom: 12px;
  }
  .editor-card input:focus { border-color: #0f6e56; }
  .editor-card textarea {
    width: 100%; height: 240px; padding: 12px; font-size: 13px; line-height: 1.7;
    border: 1px solid #d3d1c7; border-radius: 8px; outline: none; resize: vertical;
    font-family: inherit;
  }
  .editor-card textarea:focus { border-color: #0f6e56; }
  .editor-row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .char-count { font-size: 12px; color: #b4b2a9; margin-left: auto; }
  .btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; background: #0f6e56; color: #fff; }
  .btn:disabled { background: #b4b2a9; cursor: not-allowed; }
  .btn-ghost { background: none; border: 1px solid #d3d1c7; color: #5f5e5a; }
  .tip { font-size: 12px; color: #b4b2a9; margin-top: 10px; line-height: 1.7; }

  /* ===== 历史版本列表 ===== */
  .list-card { flex: 1; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px 24px; min-width: 0; }
  .list-card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .ver-item { border: 1px solid #eee; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .ver-item .head { display: flex; align-items: center; gap: 8px; }
  .ver-item .name { font-size: 13px; font-weight: 600; }
  .ver-item .meta { font-size: 11px; color: #b4b2a9; margin-left: auto; }
  .ver-item .preview { font-size: 12px; color: #888780; margin-top: 6px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge-active { font-size: 11px; background: #eaf3de; color: #3b6d11; border-radius: 10px; padding: 2px 8px; }
  .btn-act { font-size: 12px; border: 1px solid #0f6e56; background: #fff; color: #0f6e56; border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-left: 8px; }
  .btn-act:hover { background: #e1f5ee; }
  .btn-edit { font-size: 12px; border: none; background: none; color: #185fa5; cursor: pointer; margin-left: 8px; }

  .toast { position: fixed; top: 18px; right: 18px; padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 9; }
  .toast.ok { display: block; background: #eaf3de; border: 1px solid #97c459; color: #3b6d11; }
  .toast.fail { display: block; background: #fcebeb; border: 1px solid #f09595; color: #a32d2d; }
</style>
</head>
<body>

<aside class="nav">
  <div class="brand">补货协同系统<small>总部管理后台</small></div>
  <a href="/admin/kb">制度知识库</a>
  <a class="active" href="/admin/prompts">提示词模板</a>
  <a href="/admin/audit">对话审计</a>
  <div class="foot"><span id="me"></span> · <a href="/">问答页</a> · <a href="javascript:logout()">退出</a></div>
</aside>

<section class="main">
  <div class="page-header">
    <h1>提示词模板管理</h1>
    <p>系统提示词存于数据库，设为生效后问答立即使用新版本，无需重启服务</p>
  </div>
  <div class="content">

    <!-- 编辑区 -->
    <div class="editor-card">
      <h2>新建 / 编辑模板</h2>
      <input type="text" id="pName" placeholder="模板名称（如：默认模板 / 严格引用版）" maxlength="30">
      <textarea id="pContent" placeholder="输入系统提示词内容…" maxlength="2000"></textarea>
      <div class="editor-row">
        <button class="btn" id="btnSave">保存为新版本</button>
        <button class="btn btn-ghost" id="btnReset">清空</button>
        <span class="char-count" id="charCount">0 / 2000</span>
      </div>
      <p class="tip">保存不会立即生效，需在右侧历史版本中点「设为生效」；旧版本保留可随时切回。</p>
    </div>

    <!-- 历史版本 -->
    <div class="list-card">
      <h2>历史版本</h2>
      <div id="verList"></div>
    </div>

  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const TOKEN = localStorage.getItem('token');

async function apiFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, {
    'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json'
  });
  const resp = await fetch(url, options);
  if (resp.status === 401 || resp.status === 403) {
    localStorage.removeItem('token');
    location.href = '/login';
    throw new Error('unauthorized');
  }
  return resp;
}
function logout() { localStorage.removeItem('token'); location.href = '/login'; }
function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + (ok ? 'ok' : 'fail');
  t.textContent = msg;
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

async function initAuth() {
  if (!TOKEN) { location.href = '/login'; return; }
  try {
    const resp = await apiFetch('/api/me');
    const u = (await resp.json()).user;
    if (u.role !== 'admin') { location.href = '/'; return; }
    document.getElementById('me').textContent = u.sub;
  } catch (e) {}
}

/* 加载版本列表 */
async function loadPrompts() {
  const wrap = document.getElementById('verList');
  try {
    const resp = await apiFetch('/api/prompts');
    const prompts = (await resp.json()).prompts;
    if (!prompts.length) { wrap.innerHTML = '<p style="color:#b4b2a9;font-size:13px">暂无模板</p>'; return; }
    wrap.innerHTML = '';
    prompts.forEach(p => {
      const div = document.createElement('div');
      div.className = 'ver-item';
      const head = document.createElement('div');
      head.className = 'head';
      head.innerHTML = '<span class="name"></span>' +
        (p.is_active ? '<span class="badge-active">生效中</span>' : '') +
        '<span class="meta"></span>' +
        (p.is_active ? '' : '<button class="btn-act">设为生效</button>') +
        '<button class="btn-edit">编辑</button>';
      head.querySelector('.name').textContent = p.name;
      head.querySelector('.meta').textContent = (p.updated_by || '') + ' · ' + (p.updated_at || '').replace('T', ' ');
      if (!p.is_active) head.querySelector('.btn-act').onclick = () => activate(p.id, p.name);
      head.querySelector('.btn-edit').onclick = () => {
        document.getElementById('pName').value = p.name;
        document.getElementById('pContent').value = p.content;
        updateCount();
        window.scrollTo(0, 0);
      };
      div.appendChild(head);
      const prev = document.createElement('div');
      prev.className = 'preview';
      prev.textContent = p.content;
      div.appendChild(prev);
      wrap.appendChild(div);
    });
  } catch (e) {}
}

/* 设为生效 */
async function activate(id, name) {
  if (!confirm('确定将「' + name + '」设为生效版本吗？问答将立即使用该提示词。')) return;
  try {
    const resp = await apiFetch('/api/prompts/' + id + '/activate', { method: 'PUT' });
    const data = await resp.json();
    toast(data.message || (resp.ok ? '已生效' : '操作失败'), resp.ok);
    if (resp.ok) loadPrompts();
  } catch (e) { toast('操作异常', false); }
}

/* 保存新版本 */
document.getElementById('btnSave').onclick = async () => {
  const name = document.getElementById('pName').value.trim();
  const content = document.getElementById('pContent').value.trim();
  if (!content) { toast('模板内容不能为空', false); return; }
  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    const resp = await apiFetch('/api/prompts', {
      method: 'POST',
      body: JSON.stringify({ name, content })
    });
    const data = await resp.json();
    toast(data.message || (resp.ok ? '已保存' : '保存失败'), resp.ok);
    if (resp.ok) loadPrompts();
  } catch (e) { toast('保存异常', false); }
  finally { btn.disabled = false; btn.textContent = '保存为新版本'; }
};

document.getElementById('btnReset').onclick = () => {
  document.getElementById('pName').value = '';
  document.getElementById('pContent').value = '';
  updateCount();
};

/* 字数统计 */
function updateCount() {
  document.getElementById('charCount').textContent =
    document.getElementById('pContent').value.length + ' / 2000';
}
document.getElementById('pContent').addEventListener('input', updateCount);

initAuth().then(loadPrompts);
</script>
</body>
</html>
