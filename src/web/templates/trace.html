<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执行轨迹 · 门店补货与库存协同</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; height: 100vh; background: #f4f6f9; color: #2c2c2a;
  }
  .nav { width: 220px; background: #085041; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; }
  .nav .brand { padding: 20px 18px; font-size: 15px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,.12); }
  .nav .brand small { display: block; font-size: 11px; font-weight: 400; color: #9fe1cb; margin-top: 4px; }
  .nav a { display: block; padding: 12px 18px; color: #cdeee2; font-size: 13px; text-decoration: none; border-left: 3px solid transparent; }
  .nav a:hover { background: rgba(255,255,255,.08); }
  .nav a.active { background: rgba(255,255,255,.12); border-left-color: #fac775; color: #fff; }
  .nav .foot { margin-top: auto; padding: 16px 18px; font-size: 12px; color: #9fe1cb; }
  .nav .foot a { padding: 0; color: #fac775; display: inline; border: none; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .page-header { padding: 16px 28px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; }
  .page-header h1 { font-size: 16px; font-weight: 600; }
  .page-header p { font-size: 12px; color: #888780; margin-top: 4px; }
  .btn { padding: 7px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; background: #0f6e56; color: #fff; }
  .btn.ghost { background: #fff; color: #5f5e5a; border: 1px solid #d3d1c7; }

  .content { flex: 1; display: flex; min-height: 0; }
  .list { width: 380px; border-right: 1px solid #e5e5e5; background: #fff; overflow-y: auto; }
  .list .hint { padding: 12px 16px; font-size: 12px; color: #888780; border-bottom: 1px solid #f0f0f0; }
  .run { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  .run:hover { background: #f7fdfa; }
  .run.active { background: #e1f5ee; border-left: 3px solid #0f6e56; }
  .run .q { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.5; }
  .run .meta { font-size: 11px; color: #888780; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; border-radius: 10px; padding: 1px 8px; }
  .st-done { background: #eaf3de; color: #3b6d11; }
  .st-waiting_confirm { background: #fdf3d8; color: #854f0b; }
  .st-cancelled { background: #f1efe8; color: #5f5e5a; }
  .st-failed, .st-rounds_exhausted { background: #fcebeb; color: #a32d2d; }

  .detail { flex: 1; overflow-y: auto; padding: 20px 24px; min-width: 0; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .kv { display: flex; gap: 8px; font-size: 13px; line-height: 1.8; color: #444441; }
  .kv .k { color: #888780; width: 76px; flex-shrink: 0; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .metric { background: #f7f9fc; border-radius: 10px; padding: 10px 12px; }
  .metric .v { font-size: 18px; font-weight: 600; color: #0f6e56; }
  .metric .v.warn { color: #c07417; }
  .metric .n { font-size: 11px; color: #888780; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  th { color: #888780; font-weight: 400; background: #fafafa; position: sticky; top: 0; }
  td.tool { font-family: Consolas, monospace; white-space: nowrap; }
  td.args { font-family: Consolas, monospace; color: #5f5e5a; word-break: break-all; max-width: 240px; }
  td.sum { color: #444441; line-height: 1.6; }
  tr.round-start td { border-top: 2px solid #e5e5e5; }
  .mark { font-size: 11px; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
  .mark.int { background: #fdf3d8; color: #854f0b; }
  .mark.ok { background: #eaf3de; color: #3b6d11; }
  .mark.fail { background: #fcebeb; color: #a32d2d; }
  .mark.blk { background: #fdf3d8; color: #854f0b; }
  .mark.skip { background: #f1efe8; color: #888780; }
  .empty { color: #b4b2a9; font-size: 13px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>

<aside class="nav">
  <div class="brand">补货协同系统<small>总部管理后台</small></div>
  <a href="/admin/kb">制度知识库</a>
  <a href="/admin/prompts">提示词模板</a>
  <a href="/admin/audit">对话审计</a>
  <a class="active" href="/admin/trace">执行轨迹</a>
  <div class="foot"><span id="me"></span> · <a href="/">问答页</a> · <a href="javascript:logout()">退出</a></div>
</aside>

<section class="main">
  <div class="page-header">
    <div>
      <h1>执行轨迹</h1>
      <p>每次问答的模型决策与工具调用明细，用于评估「调用轨迹质量」：轮数是否超标、有没有原地打转、是否卡在门禁</p>
    </div>
    <button class="btn ghost" id="btnRefresh">刷新</button>
  </div>
  <div class="content">
    <div class="list" id="runList"><p class="empty">加载中…</p></div>
    <div class="detail" id="detail"><p class="empty">从左侧选择一次问答，查看轨迹</p></div>
  </div>
</section>

<script>
const TOKEN = localStorage.getItem('token');

async function apiFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + TOKEN });
  const resp = await fetch(url, options);
  if (resp.status === 401 || resp.status === 403) {
    localStorage.removeItem('token'); location.href = '/login';
    throw new Error('unauthorized');
  }
  return resp;
}
function logout() { localStorage.removeItem('token'); location.href = '/login'; }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function statusText(s) {
  return { done: '完成', waiting_confirm: '待确认', cancelled: '已取消',
           failed: '失败', rounds_exhausted: '轮次耗尽', running: '运行中' }[s] || s;
}

async function initAuth() {
  if (!TOKEN) { location.href = '/login'; return false; }
  try {
    const u = (await (await apiFetch('/api/me')).json()).user;
    if (u.role !== 'admin') { location.href = '/'; return false; }
    document.getElementById('me').textContent = u.sub;
    return true;
  } catch (e) { return false; }
}

/* ---------------- 运行列表 ---------------- */
async function loadRuns() {
  const resp = await apiFetch('/api/agent/runs?limit=60');
  const data = await resp.json();
  const box = document.getElementById('runList');
  if (!data.runs || !data.runs.length) {
    box.innerHTML = '<p class="empty">还没有执行记录<br>去问答页提一个问题试试</p>';
    return;
  }
  box.innerHTML = '<div class="hint">共 ' + data.runs.length + ' 次运行（按时间倒序）</div>';
  data.runs.forEach(r => {
    const el = document.createElement('div');
    el.className = 'run';
    el.dataset.id = r.id;
    el.innerHTML =
      '<div class="q">' + esc(r.question) + '</div>' +
      '<div class="meta">' +
      '  <span class="badge st-' + r.status + '">' + statusText(r.status) + '</span>' +
      '  <span>轮 ' + r.rounds + '/' + r.max_rounds + '</span>' +
      '  <span>工具 ' + r.tool_calls + '</span>' +
      '  <span>阻断 ' + r.blocked + '</span>' +
      '  <span>' + (r.decision_ms + r.tool_ms) + 'ms</span>' +
      '  <span>' + esc(r.created_at) + '</span>' +
      '</div>';
    el.onclick = () => loadDetail(r.id, el);
    box.appendChild(el);
  });
}

/* ---------------- 单次运行明细 ---------------- */
async function loadDetail(runId, el) {
  document.querySelectorAll('.run').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');

  const resp = await apiFetch('/api/agent/runs/' + runId + '/steps');
  const data = await resp.json();
  const run = data.run, steps = data.steps || [], q = data.quality || {};
  const box = document.getElementById('detail');

  let rows = '';
  steps.forEach(s => {
    const marks = [];
    if (s.decision === 'interrupt') marks.push('<span class="mark int">⏸ 中断待确认</span>');
    if (s.decision === 'confirmed') marks.push('<span class="mark ok">✔ 人工确认后执行</span>');
    if (s.decision === 'cancelled') marks.push('<span class="mark skip">已取消</span>');
    if (s.decision === 'skipped') marks.push('<span class="mark skip">中断后未执行</span>');
    if (s.blocking) marks.push('<span class="mark blk">! 停止条件</span>');
    if (!s.ok && s.decision === 'tool_call') marks.push('<span class="mark fail">✕ 失败</span>');
    const isModel = s.tool === '__model__';
    rows +=
      '<tr class="' + (s.step_no === 0 ? 'round-start' : '') + '">' +
      '<td>' + s.round_no + '</td>' +
      '<td>' + s.step_no + '</td>' +
      '<td class="tool">' + (isModel ? '模型决策' : esc(s.tool)) + '</td>' +
      '<td class="args">' + (isModel ? '' : esc(JSON.stringify(s.args))) + '</td>' +
      '<td>' + s.duration_ms + 'ms</td>' +
      '<td class="sum">' + esc(s.result_summary) + marks.join('') + '</td>' +
      '</tr>';
  });

  box.innerHTML =
    '<div class="card">' +
    '  <h2>运行信息</h2>' +
    '  <div class="kv"><span class="k">问题</span><span>' + esc(run.question) + '</span></div>' +
    '  <div class="kv"><span class="k">状态</span><span>' + statusText(run.status) +
    '（' + run.round_used + '/' + run.max_rounds + ' 轮）</span></div>' +
    '  <div class="kv"><span class="k">run_id</span><span>' + esc(run.id) + '</span></div>' +
    '  <div class="kv"><span class="k">门店</span><span>' + esc(run.store_id || '-') + '</span></div>' +
    '  <div class="kv"><span class="k">最终回答</span><span>' + esc(run.answer || '（无）') + '</span></div>' +
    '</div>' +
    '<div class="card">' +
    '  <h2>轨迹质量</h2>' +
    '  <div class="metrics">' +
    '    <div class="metric"><div class="v">' + q.rounds + '</div><div class="n">决策轮次</div></div>' +
    '    <div class="metric"><div class="v">' + q.tool_calls + '</div><div class="n">工具调用</div></div>' +
    '    <div class="metric"><div class="v ' + (q.repeats ? 'warn' : '') + '">' + q.repeats + '</div><div class="n">重复调用</div></div>' +
    '    <div class="metric"><div class="v ' + (q.blocked ? 'warn' : '') + '">' + q.blocked + '</div><div class="n">命中停止条件</div></div>' +
    '    <div class="metric"><div class="v ' + (q.step_failures ? 'warn' : '') + '">' + q.step_failures + '</div><div class="n">工具失败</div></div>' +
    '    <div class="metric"><div class="v">' + q.round_efficiency + '</div><div class="n">轮内效率（工具/轮）</div></div>' +
    '    <div class="metric"><div class="v">' + q.total_ms + 'ms</div><div class="n">总耗时</div></div>' +
    '  </div>' +
    '</div>' +
    '<div class="card">' +
    '  <h2>轨迹明细（轮 / 步 / 工具 / 参数 / 耗时 / 结果摘要）</h2>' +
    '  <table><thead><tr><th>轮</th><th>步</th><th>工具</th><th>参数</th><th>耗时</th><th>结果摘要</th></tr></thead>' +
    '  <tbody>' + rows + '</tbody></table>' +
    '</div>';
}

document.getElementById('btnRefresh').onclick = loadRuns;

initAuth().then(ok => { if (ok) loadRuns(); });
</script>
</body>
</html>
